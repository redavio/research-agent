[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "A small, truly agentic market research agent: give it a goal, it picks its own tools, and it reports back (or says nothing is worth reporting)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "openai>=1.40",
    "anthropic>=0.40",
]

[project.optional-dependencies]
youtube = ["youtube-transcript-api>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
