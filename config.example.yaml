# Example config for a fictional company. Copy to config.yaml and make it yours:
#   cp config.example.yaml config.yaml

# What the agent is trying to do. It plans its own steps toward this.
goal: "Find what changed in my market this week that matters to me."

business:
  name: "Fieldline (fictional example)"
  sells: "Scheduling, dispatch and invoicing software for field service businesses."
  to: "Small and mid-size HVAC, plumbing and electrical contractors in North America."

competitors:
  - name: ServiceTitan
    urls: ["https://www.servicetitan.com/pricing"]
  - name: Housecall Pro
    urls: ["https://www.housecallpro.com/pricing/"]
  - name: Jobber
    urls: ["https://getjobber.com/pricing/"]   # this site blocks bots; the agent sees the error and moves on

# Where to look. Types: rss | web | youtube | reddit
sources:
  - id: achr-news
    type: rss
    url: "https://www.achrnews.com/rss/articles"
    note: "HVAC trade news"
  - id: field-service-news
    type: rss
    url: "https://www.fieldservicenews.com/feed"
    note: "Field service industry news"
  - id: r-hvac
    type: reddit
    url: "https://www.reddit.com/r/HVAC"
    note: "Needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET; without them the agent gets a clear error"
  - id: jobber-youtube
    type: youtube
    url: "https://www.youtube.com/@Jobber"

care_about:
  - competitor pricing or packaging changes
  - new product launches or AI features from competitors
  - regulation or refrigerant rules that change contractor workflows
  - funding, acquisitions or layoffs in field service software

ignore:
  - generic home-owner tips
  - consumer product reviews
  - stories older than the lookback window

lookback_days: 7

limits:
  max_steps: 40          # hard cap on model turns
  max_cost_usd: 0.40     # hard cap on estimated LLM spend per run
  max_result_chars: 6000 # longest tool result the model sees in one turn

llm:
  provider: openai       # openai | anthropic  (env RESEARCH_LLM_PROVIDER wins)
  model: gpt-4.1-mini    # env RESEARCH_LLM_MODEL wins
  temperature: 0.2
  # price_per_mtok: { input: 0.40, output: 1.60 }  # only needed for models not in the built-in table

output:
  dir: runs
  memory_path: research_memory.sqlite
