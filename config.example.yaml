# Example config for a fictional company. Copy to config.yaml and make it yours:
#   cp config.example.yaml config.yaml

# What the agent is trying to do. It plans its own steps toward this.
goal: "Find what changed in my market this week that matters to me."

business:
  name: "Brightline (fictional example)"
  sells: "Marketing analytics software that shows which campaigns create pipeline."
  to: "Performance marketing and demand gen teams at B2B SaaS companies."

competitors:
  - name: Optmyzr
    urls: ["https://www.optmyzr.com/pricing/"]
  - name: Supermetrics
    urls: ["https://supermetrics.com/pricing"]

# Where to look. Types: rss | web | youtube | reddit
sources:
  - id: search-engine-roundtable
    type: rss
    url: "https://www.seroundtable.com/index.xml"
    note: "Daily Google and Microsoft search and ads news"
  - id: ppc-land
    type: rss
    url: "https://ppc.land/rss/"
    note: "Paid media news"
  - id: google-ads-blog
    type: rss
    url: "https://blog.google/products/ads-commerce/rss/"
    note: "Google's own ads announcements"
  - id: r-ppc
    type: reddit
    url: "https://www.reddit.com/r/PPC"
    note: "Needs REDDIT_CLIENT_ID / REDDIT_CLIENT_SECRET; without them the agent gets a clear error"

care_about:
  - Google Ads and Microsoft Advertising changes that affect B2B campaigns
  - AI search and answer engines changing how B2B buyers find vendors
  - LinkedIn Ads and B2B targeting changes
  - competitor pricing, packaging or new AI features

ignore:
  - local SEO and ecommerce-only tips
  - opinion pieces with no new facts
  - stories older than the lookback window

lookback_days: 7

limits:
  max_steps: 40          # hard cap on model turns
  max_cost_usd: 0.40     # hard cap on estimated LLM spend per run
  max_result_chars: 6000 # longest tool result the model sees in one turn

llm:
  provider: openai       # openai | anthropic  (env RESEARCH_LLM_PROVIDER wins)
  model: gpt-4.1-mini    # env RESEARCH_LLM_MODEL wins
  temperature: 0.2
  # price_per_mtok: { input: 0.40, output: 1.60 }  # only needed for models not in the built-in table

output:
  dir: runs
  memory_path: research_memory.sqlite
